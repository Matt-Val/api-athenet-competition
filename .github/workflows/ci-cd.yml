name: Competition CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          : "${DOCKERHUB_USERNAME:?Configura la variable DOCKERHUB_USERNAME}"
          echo "name=${DOCKERHUB_USERNAME}/api-athenet-competition" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.image.outputs.name) || '' }}

  deploy:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: competition-ec2-deploy
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.image.outputs.name }}:${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_APP_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          command_timeout: 10m
          script: |
            set -eu
            test -r /opt/athenet/competition.env
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            unset DOCKERHUB_TOKEN
            docker pull "$IMAGE"
            docker rm -f athenet-competition || true
            docker run -d --name athenet-competition --restart unless-stopped \
              -p 8082:8082 --env-file /opt/athenet/competition.env "$IMAGE"
