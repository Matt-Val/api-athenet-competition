# Nombre del microservicio
spring.application.name=competition
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

server.port=${SERVER_PORT:8082}

# ===============================
# BASE DE DATOS (PostgreSQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://athenet-db.clgzbclcgbne.us-east-1.rds.amazonaws.com:5432/competition_db}
spring.datasource.username=${DB_USERNAME:competition_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SEGURIDAD (OAuth2 Resource Server - Microsoft Entra ID)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/bfbc730b-74fb-4552-b74c-c93431273927/v2.0}

# ===============================
# CORS
# ===============================
# Solo el admin Angular llama directo a este microservicio (D6/D7 del documento).
# Los endpoints /api/public/** los consumen bff-public y MS-Eventos server-to-server,
# no un navegador, así que no necesitan CORS.
app.cors.admin-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.cors.public-origins=${CORS_PUBLIC_ORIGINS:http://localhost:5173}

# ===============================
# RABBITMQ (EC2)
# ===============================
spring.rabbitmq.host=${RABBITMQ_HOST:98.91.71.40}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:athenet_admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# ===============================
# CLIENTE REST — MS-Instituciones
# ===============================
institution.api.url=${INSTITUTION_API_URL:http://localhost:8080}

# ===============================
# KAFKA (Marcador en vivo)
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=3000

app.kafka.topic.marcador=${KAFKA_TOPIC_MARCADOR:marcador}
app.kafka.topic.marcador-replicas=${KAFKA_TOPIC_REPLICAS:1}
app.kafka.send-timeout=${KAFKA_SEND_TIMEOUT:3s}
app.kafka.team-names-ttl=${KAFKA_TEAM_NAMES_TTL:10m}
