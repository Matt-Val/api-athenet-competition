# Nombre del microservicio
spring.application.name=competition
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

server.port=${SERVER_PORT:8082}

# ===============================
# BASE DE DATOS (PostgreSQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://athenet-db.clgzbclcgbne.us-east-1.rds.amazonaws.com:5432/competition_db}
spring.datasource.username=${DB_USERNAME:competition_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SEGURIDAD (OAuth2 Resource Server - Microsoft Entra ID)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/bfbc730b-74fb-4552-b74c-c93431273927/v2.0}

# ===============================
# CORS
# ===============================
# Solo el admin Angular llama directo a este microservicio (D6/D7 del documento).
# Los endpoints /api/public/** los consumen bff-public y MS-Eventos server-to-server,
# no un navegador, así que no necesitan CORS.
app.cors.admin-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===============================
# RABBITMQ (EC2)
# ===============================
spring.rabbitmq.host=${RABBITMQ_HOST:98.91.71.40}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:athenet_admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# ===============================
# CLIENTE REST — MS-Instituciones
# ===============================
institution.api.url=${INSTITUTION_API_URL:http://localhost:8080}
